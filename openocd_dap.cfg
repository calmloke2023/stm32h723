# 选择调试器为cmsis-dap

source [find interface/cmsis-dap.cfg]
#使用cmsis-dap硬件进行调试,注意其他地方也要更改
# OpenOCD作为GDB和硬件调试器的桥梁(为硬件提供抽象,把接口给GDB),支持多种硬件调试器.
# OpenOCD会自动在其根目录的share/openocd/scripts/interface里面寻找对应的配置文件

# 选择接口为SWD
transport select swd

# 选择目标芯片
source [find target/stm32h7x.cfg]
# OpenOCD会自动在其根目录的share/openocd/scripts/target里面寻找对应的配置文件

# SEGGER RTT 日志:启动调试后,在 VSCode 里运行任务 "rtt log" 即可查看(或手动连接 localhost:9090)
rtt setup 0x20000000 0x20000 "SEGGER RTT"
rtt server start 9090 0